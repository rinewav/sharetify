# MiniServer で中央サーバーを走らせるための構成。
#
# 外に出す役 (cloudflared) は既にこの機械で動いているので、
# ここでは中央サーバーだけを立て、その役から見える所に置く。
# 直接ポートを開けないので、家の回線に穴を空けずに済む。

services:
  hub:
    build:
      context: ..
      dockerfile: packages/hub/Dockerfile
    image: sharetify-hub:latest
    container_name: sharetify-hub
    restart: unless-stopped
    environment:
      PORT: "47820"
    volumes:
      # 覚えておくもの (利用者・集まり・並び) はここに残る。
      # 入れ物を作り直しても消えない。
      - hub-data:/app/data
    # 同じ機械の中からだけ届く所に出す。
    # 外へは、既に動いている外向きの役が取り次ぐ。
    ports:
      - "127.0.0.1:47820:47820"

volumes:
  hub-data:
