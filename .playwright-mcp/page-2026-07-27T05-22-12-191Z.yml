          - heading "紹介" [level=2] [ref=f18e1191]
          - paragraph [ref=f18e1192]: "Yoasobi is a Japanese musical duo formed in 2019. It consists of songwriter and producer Ayase and vocalist Ikura. Represented by the slogan \"novel into music\", the duo's narrative-driven songs are originally based on selected fictional stories posted on the website Monogatary.com. Later, sources also come from various media, such as fiction written by professional authors, books, letters, messages, plays, and social media posts. Known for its fast pace and complex structure, their music has been characterized as a blend of J-pop and Vocaloid music. Rising to prominence during 2020 in Japan, Yoasobi's debut single, \"Yoru ni Kakeru\", topped the Billboard Japan Hot 100 for six non-consecutive weeks and its 2020 year-end chart, the first ever non-CD single to do so, as well as receiving the first ever diamond and double diamond certifications for streaming figures from the Recording Industry Association of Japan. Three other songs were also certified diamond: Blue Period-inspired \"Gunjō\" and anime series openers \"Kaibutsu\" from Beastars and \"Idol\" from Oshi no Ko. From Wikipedia (https://en.wikipedia.org/wiki/Yoasobi) under Creative Commons Attribution CC-BY-SA 3.0 (http://creativecommons.org/licenses/b...)"
